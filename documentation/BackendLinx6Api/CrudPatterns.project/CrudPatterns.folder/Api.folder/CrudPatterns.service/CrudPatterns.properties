ent:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/DefaultResponse'\r\n                      \r\ncomponents:\r\n  schemas:\r\n    DefaultResponse:\r\n      type: object\r\n      properties:\r\n        Id:\r\n          type: integer\r\n        MessageType:\r\n          type: string\r\n        Messages:\r\n          type: array\r\n          items:\r\n            type: string\r\n    AnimalRead:\r\n      type: object\r\n      properties:\r\n        Id:\r\n          type: integer\r\n          example: '1'\r\n        Name:\r\n          type: string\r\n          example: 'Dog'\r\n        Species:\r\n          type: string\r\n          example: 'Panthera Leo'\r\n        Age:\r\n          type: integer\r\n          example: '12'\r\n        HabitatId:\r\n          type: integer\r\n          example: '4'\r\n        HabitatName:\r\n          type: string\r\n          example: 'Forest'\r\n        Diet:\r\n          type: string\r\n          example: 'Carnivore'\r\n        LastChangedUser:\r\n          type: string\r\n          example: 'John Doe'\r\n        LastChangedDate:\r\n          type: string\r\n          example: '2024-05-02 12:00:21'\r\n    AnimalReadList:\r\n      type: object\r\n      properties:\r\n        Animals:\r\n          type: array\r\n          items:\r\n            $ref: '#/components/schemas/AnimalRead'\r\n    AnimalWrite:\r\n      type: object\r\n      properties:\r\n        Name:\r\n          type: string\r\n          example: 'Dog'\r\n        Species:\r\n          type: string\r\n          example: 'Panthera Leo'\r\n        Age:\r\n          type: integer\r\n          example: '12'\r\n        HabitatId:\r\n          type: integer\r\n          example: '4'\r\n        Diet:\r\n          type: string\r\n          example: 'Carnivore'\r\n    HabitatRead:\r\n      type: object\r\n      properties:\r\n        Id:\r\n          type: integer\r\n          example: '4'\r\n        Name:\r\n          type: s