        "Value": "openapi: 3.0.1\r\ninfo:\r\n  title: CrudPatterns\r\n  version: 1.0.0\r\nservers:\r\n  - url: http://localhost:10002\r\npaths:\r\n  /v1/animals:\r\n    get:\r\n      tags:\r\n        - Animals\r\n      security:\r\n        - ApiKeyAuth: []\r\n      operationId: AnimalGetList\r\n      summary: Get a list of all animals\r\n      description: Get a list of all animals\r\n      responses:\r\n        '200':\r\n          description: OK (200)\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/AnimalReadList'\r\n        '401':\r\n          description: Unauthorized (401)\r\n        '500':\r\n          description: Internal Server Error (500)\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/DefaultResponse'\r\n    post:\r\n      tags:\r\n        - Animals\r\n      security:\r\n        - ApiKeyAuth: []\r\n      operationId: AnimalCreate\r\n      summary: Create a new animal\r\n      parameters:\r\n        - name: LastChangedUser\r\n          in: header\r\n          description: Name of user performing the action\r\n          required: true\r\n          schema:\r\n            type: string\r\n            example: 'John Doe'\r\n      requestBody:\r\n        required: true\r\n        content:\r\n          application/json:\r\n            schema:\r\n              $ref: '#/components/schemas/AnimalWrite'\r\n      responses:\r\n        '200':\r\n          description: OK (200)\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/DefaultResponse'\r\n        '401':\r\n          description: Unauthorized (401)\r\n        '500':\r\n          description: Internal Server Error (500)\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/DefaultResponse'\r\n                   